<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>작업 현황</title>
<style>
  :root { color-scheme:light dark; font:14px/1.6 system-ui,sans-serif; }
  body { margin:0; padding:20px; max-width:760px; color:light-dark(#20242d,#eceff4); background:light-dark(#fafafa,#191b20); }
  h1 { font-size:18px; margin:4px 0 12px; overflow-wrap:anywhere; }
  h2 { font-size:14px; margin:0; font-weight:600; }
  p { margin:6px 0; }
  .muted { color:light-dark(#626977,#abb1bf); font-size:12px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  button, .open-work { font:inherit; cursor:pointer; border:1px solid #8886; border-radius:8px; padding:5px 10px; background:transparent; color:inherit; flex-shrink:0; }
  .open-work { display:inline-block; text-decoration:none; margin-top:8px; }
  #connection[data-error=true], #attention { color:light-dark(#963500,#ffba82); }
  #attention:empty { display:none; }
  #attention { padding:10px; border:1px solid #a7653955; border-radius:8px; }
  #summary { margin:12px 0; font-weight:600; }
  article { border-top:1px solid #8884; padding:14px 0; }
  article p { white-space:pre-wrap; overflow-wrap:anywhere; }
  .state { font-size:12px; white-space:nowrap; }
  [hidden] { display:none !important; }
  details { margin-top:8px; font-size:12px; }
  summary { cursor:pointer; }
  a:focus-visible,button:focus-visible,summary:focus-visible { outline:2px solid #4687ea; outline-offset:3px; }
  @media(max-width:380px) { body{padding:12px} .row{align-items:flex-start} }
</style>
<main>
  <div class="row"><span class="muted">작업 현황 · 조회 전용</span><button id="refresh">새로고침</button></div>
  <h1 id="name">작업을 불러오는 중…</h1>
  <a id="primary" class="open-work" hidden>작업 열기</a>
  <p id="preparation" role="status"></p>
  <p id="overall"></p><p id="summary"></p><p id="attention" role="status"></p>
  <p id="next-action"></p>
  <details id="diagnostics" hidden><summary>진단 정보</summary><p id="diagnostic-text"></p></details>
  <p id="connection" class="muted" role="status">연결 중…</p><p id="updated" class="muted"></p>
  <details id="task-structure"><summary>하위 작업 보기</summary><section id="tasks" aria-label="작업 목록"></section></details>
  <p class="muted">표시 갱신은 작업 실행 여부와 다릅니다. 이 패널은 작업을 실행하거나 재시도하지 않습니다.</p>
</main>
<script>
const labels = { draft:'준비 중',accepted:'접수됨',planning:'계획 중',preparing:'준비 중',agents_prepared:'준비됨',awaiting_user_start:'대기 중',staged:'준비 중',blocked:'선행 작업 대기',queued:'실행 대기',waiting_for_lease:'작업 공간 대기',retry_waiting:'재시도 대기',running:'진행 중',approval_waiting:'승인 필요',agent_done:'검증 대기',validating:'검증 중',integration_pending:'통합 중',upgrade_pending:'업데이트 대기',recovery_attention:'복구 확인 필요',completed:'완료',completed_with_warnings:'완료 · 주의 사항',skipped:'건너뜀',rejected:'결과 반려',validation_failed:'검증 실패',failed:'실패',canceled:'취소됨',cancelled:'취소됨',interrupted:'중단됨',blocked_by_policy:'권한 확인 필요',integration_blocked:'통합 확인 필요' };
const el = id => document.getElementById(id);
const statusLabel = status => labels[status] || '상태 확인 필요';
const date = value => value && Number.isFinite(Date.parse(value)) ? new Date(value).toLocaleString('ko-KR') : '정보 없음';
let timer, busy = false, lastSuccess = null;
const cards = new Map();
const validThread = id => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id || '');
const actions = { inspect_execution_evidence:'작업 기록에서 검증 명령과 종료 결과를 확인해주세요. 확인 전에는 다시 실행하지 않습니다.',
  reconcile_dispatch:'작업 기록에서 실제 종료 여부를 확인해주세요. 중복 실행하지 않습니다.', inspect_dispatch:'작업 기록에서 실행 상태를 확인해주세요.',
  inspect_side_effects:'이미 적용된 변경이 있는지 확인한 뒤 복구를 진행해주세요.', repair_contract:'요청의 권한·실행 조건을 수정한 뒤 해당 작업의 복구를 요청해주세요.',
  rework:'작업 기록의 지적 사항을 확인한 뒤 수정 작업을 요청해주세요.', retry:'자동 복구를 기다리거나 작업 기록을 확인해주세요.',
  manual_intervention:'작업 기록을 확인한 뒤 필요한 조치를 요청해주세요.' };
function guide(status, action) {
  if(status==='approval_waiting') return '작업을 열어 승인 요청을 확인해주세요.';
  return actions[action] || '작업을 열어 원인을 확인하고 필요한 조치를 요청해주세요.';
}
function setText(node,value) { if(node.textContent!==value) node.textContent=value; }
function setLink(node,threadId,label) {
  node.hidden=!validThread(threadId);
  if(node.hidden) node.removeAttribute('href');
  else node.href=`codex://threads/${threadId}`;
  setText(node,label);
}
function render(snapshot) {
  const {work,tasks} = snapshot;
  el('name').textContent = work.name || '작업';
  const p=work.progress;
  el('overall').textContent = work.status === 'failed' && p.rejected && !p.failed
    ? '실패 · 결과 검증 거절' : statusLabel(work.status) + (work.needsAttention ? ' · 확인 필요' : '');
  el('summary').textContent = [`전체 ${p.total}개 · 성공 ${p.succeeded}개`, ...[['active','진행'],['waiting','대기'],['rejected','반려'],['failed','실패'],['attention','확인 필요'],['cancelled','취소'],['skipped','건너뜀'],['unknown','미확인']].filter(([key])=>p[key]).map(([key,label])=>`${label} ${p[key]}개`), ...(p.warnings ? [`성공 중 주의 ${p.warnings}개`] : [])].join(' · ');
  setLink(el('primary'),work.master?.threadId,work.master?.label || '작업 열기');
  const terminal=['completed','failed','cancelled'].includes(work.status);
  setText(el('preparation'),validThread(work.master?.threadId) ? '' : terminal
    ? '이동할 작업 대화가 없습니다.' : '요청을 접수했습니다. 작업을 준비하고 있으며, 대화가 생성되면 이동 링크가 표시됩니다.');
  el('summary').hidden=!p.total;
  el('task-structure').hidden=tasks.length<2;
  el('attention').textContent = work.needsAttention ? (work.attention?.cause || '확인이 필요한 작업이 있습니다. 아래 작업 기록에서 자세한 내용을 볼 수 있습니다.') : '';
  el('next-action').textContent = work.needsAttention ? guide(work.status,work.attention?.nextAction) : '';
  el('diagnostics').hidden=!work.attention?.cause;
  setText(el('diagnostic-text'),work.attention?.cause || '');
  el('updated').textContent = `작업 기록 변경: ${date(work.lastUpdatedAt)}`;
  const present=new Set(tasks.map(task=>task.id));
  for(const [id,card] of cards) if(!present.has(id)) { card.article.remove();cards.delete(id); }
  const names=new Map(tasks.map(task=>[task.id,task.name]));
  for (const task of tasks) {
    let card=cards.get(task.id);
    if(!card) {
      const make=tag=>document.createElement(tag);
      card={article:make('article'),row:make('div'),title:make('h2'),state:make('span'),description:make('p'),dependency:make('p'),guidance:make('p'),link:make('a'),details:make('details'),diagnostic:make('p')};
      card.row.className='row';card.state.className='state';card.link.className='open-work';card.dependency.className='muted';
      const summary=make('summary');summary.textContent='진단 정보';card.details.append(summary,card.diagnostic);
      card.row.append(card.title,card.state);card.article.append(card.row,card.description,card.dependency,card.guidance,card.link,card.details);
      cards.set(task.id,card);el('tasks').append(card.article);
    }
    setText(card.title,task.name);setText(card.state,statusLabel(task.status));setText(card.description,task.description || '');
    const upstream=(task.dependsOn || []).map(id=>names.get(id) || '선행 작업');
    setText(card.dependency,upstream.length ? `${upstream.join(' + ')} → ${task.name}` : '');
    card.dependency.hidden=!upstream.length;
    const attention=['failed','rejected','validation_failed','interrupted','approval_waiting','recovery_attention','blocked_by_policy','integration_blocked'].includes(task.status);
    setText(card.guidance,attention ? guide(task.status,task.nextAction) : '');
    setLink(card.link,task.threadId,'작업 열기');card.link.setAttribute('aria-label',`${task.name} 작업 열기`);
    card.details.hidden=!task.issue;setText(card.diagnostic,task.issue || '');
  }
}
async function refresh() {
  clearTimeout(timer);
  if(document.hidden || busy) return;
  busy=true; el('refresh').disabled=true;
  const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),8000);
  try {
    const url=new URL('/api/progress',location.href);url.searchParams.set('viewToken',new URL(location.href).searchParams.get('viewToken') || '');
    const response=await fetch(url,{signal:controller.signal,cache:'no-store'});
    if(!response.ok) throw new Error(response.status===403 ? '연결 만료 · 패널을 다시 열어주세요.' : '연결을 확인해주세요.');
    render(await response.json());lastSuccess=new Date().toISOString();
    el('connection').dataset.error='false';el('connection').textContent=`표시 갱신: ${date(lastSuccess)}`;
  } catch(error) {
    el('connection').dataset.error='true';el('connection').textContent=`갱신 끊김 · ${error.name==='AbortError'?'응답 시간 초과':error.message} 마지막 수신: ${date(lastSuccess)}. 기존 표시는 최신 상태가 아닐 수 있습니다. 데몬을 재시작했다면 이 대화에서 “${el('name').textContent} 현황 패널을 다시 열어줘”라고 요청해주세요.`;
  } finally {
    clearTimeout(timeout);busy=false;el('refresh').disabled=false;
    if(!document.hidden) timer=setTimeout(refresh,5000);
  }
}
el('refresh').onclick=refresh;
document.addEventListener('visibilitychange',()=>{ clearTimeout(timer);if(!document.hidden) void refresh(); });
void refresh();
</script></html>
